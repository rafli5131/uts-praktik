version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: Database_Implementation_MySQL
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: iot
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - iot-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: Database_Implementation_PHPMyAdmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: root123
    depends_on:
      - mysql_db
    networks:
      - iot-network

  mongodb:
    image: mongo:7.0
    container_name: mongodb-iot
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: iot_db
    volumes:
      - mongodb_data:/data/db
      - ./init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - iot-network

  mongo-express:
    image: mongo-express:1.0.0
    container_name: mongo-express-iot
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
      ME_CONFIG_BASICAUTH: true
    depends_on:
      - mongodb
    networks:
      - iot-network

volumes:
  mongodb_data:

networks:
  iot-network:
    driver: bridge